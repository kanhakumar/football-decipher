# Deploy: provision and deploy with azd, then the online eval gate against the deployed core and
# the Foundry model. Signs in with OIDC (federated credential set up by `azd pipeline config`);
# no secrets are stored. Images build with Docker on this runner.
name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    # Docs-only changes do not redeploy.
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/pyproject.toml
      - uses: Azure/setup-azd@v2

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign azd in (OIDC)
        run: >
          azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID"
          --federated-credential-provider github

      - name: Provision
        run: azd provision --no-prompt
      - name: Build the core jar (the core image copies it)
        working-directory: core
        run: sbt assembly
      - name: Deploy (core image, agents image, viewer)
        run: azd deploy --no-prompt

      - name: Eval gate (online)
        run: |
          python -m pip install -e "agents[eval]"
          eval "$(azd env get-values | sed 's/^/export /')"
          python eval/run.py --online --core "$CORE_URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-online
          path: eval/out/report.json
