# Deploy: provision and deploy with azd, smoke check the live core, then the online eval gate (the
# Foundry model, on a core of its own on this runner), then tag the release (ADR-022, ADR-028). Runs only for the `release` branch: work
# lands on master through feature branches, and master is promoted to release to deploy. Signs
# in with OIDC (a federated credential for refs/heads/release only); no secrets are stored.
# Images build with Docker on this runner.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump when the eval gate passes
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    branches: [release]
    # Docs-only changes do not redeploy.
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  id-token: write
  contents: write # the release tag and GitHub Release

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  # Sign-in (ADR-018): the app registrations from infra/scripts/entra-apps.sh; empty keeps it off.
  AUTH_API_CLIENT_ID: ${{ vars.AUTH_API_CLIENT_ID }}
  AUTH_VIEWER_CLIENT_ID: ${{ vars.AUTH_VIEWER_CLIENT_ID }}
  # Who edits the settings in App Configuration (ADR-019): a person's object id.
  CONFIG_EDITOR_PRINCIPAL_ID: ${{ vars.CONFIG_EDITOR_PRINCIPAL_ID }}

jobs:
  deploy:
    # Azure trusts only the release branch; a manual run on another branch would fail to sign in.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Azure/setup-azd@v2

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign azd in (OIDC)
        run: >
          azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID"
          --federated-credential-provider github

      - name: Tools for the provision hooks
        run: python -m pip install pyyaml
      - name: Provision
        run: azd provision --no-prompt
      - name: Mask the API key in the logs
        run: echo "::add-mask::$(azd env get-value SMI_API_KEY)"
      - name: Build the core jar (the core image copies it)
        working-directory: core
        run: sbt assembly
      - name: Build the viewer after provisioning, so it includes the config.js the hook wrote
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Deploy (core image, agents image, viewer)
        run: azd deploy --no-prompt

      # Read-only: the live core is up and serving its settings. It never starts a match, so a
      # match people are watching on the live site is left alone.
      - name: Smoke check the deployed core
        run: |
          core="$(azd env get-value CORE_URL)"
          for path in /health /openapi.yaml /api/config; do
            curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null "$core$path"
            echo "ok $path"
          done

      # The eval replays the demo match on its own core on this runner, built from the same jar as
      # the core image, so it never replaces a match on the live site (ADR-028). The narration
      # runs here too, with the real Foundry model.
      - name: Start a core for the eval on this runner
        run: |
          nohup java -jar core/target/scala-3.9.0/app.jar > core-eval.log 2>&1 &
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:8080/health
      - name: Eval gate (online)
        run: |
          python -m pip install -e "agents[eval]"
          eval "$(azd env get-values | sed 's/^/export /')"
          python eval/run.py --online --core http://127.0.0.1:8080
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-online
          path: |
            eval/out/report.json
            core-eval.log

      - name: Tag the release (v1.0.0, then the next patch, or minor or major from a manual run)
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v$major.$((minor + 1)).0" ;;
              *) next="v$major.$minor.$((patch + 1))" ;;
            esac
          fi
          scores=$(python -c "import json; s = json.load(open('eval/out/report.json'))['scores']; print(', '.join(f'{k} {v}' for k, v in s.items()))")
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes             --notes "Deployed to Azure and passed the online eval gate: $scores"
          echo "Released $next" >> "$GITHUB_STEP_SUMMARY"
