# Every push: tests, lint and the offline eval gate (stub model on the recorded demo match).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (Scala)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt scalafmtCheckAll test

  agents:
    name: Agents, schema and eval gate (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/pyproject.toml
      - run: python -m pip install -e "agents[dev]" -r schema/requirements.txt
      - name: Lint
        working-directory: agents
        run: |
          ruff check . ../schema ../eval
          ruff format --check src tests scripts ../eval
      - run: python schema/validate_examples.py
      - name: Agent tests
        working-directory: agents
        run: python -m pytest
      - run: python -m pytest eval/tests
      - name: Eval gate (offline)
        run: python eval/run.py --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-offline
          path: eval/out/report.json

  web:
    name: Viewer (React, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web-e2e:
    name: Viewer parity (Playwright, real core and agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Core jar
        working-directory: core
        run: sbt assembly
      - run: python -m pip install -e agents
      - name: Viewer and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Parity suite
        working-directory: web
        env:
          SMI_PYTHON: python
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
