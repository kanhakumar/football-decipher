# Every push: tests, lint and the offline eval gate (stub model on the recorded demo match).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (Scala)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt scalafmtCheckAll test

  agents:
    name: Agents, schema and eval gate (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: agents/pyproject.toml
      - run: python -m pip install -e "agents[dev]" -r schema/requirements.txt
      - name: Lint
        working-directory: agents
        run: |
          ruff check . ../schema ../eval
          ruff format --check src tests scripts ../eval
      - run: python schema/validate_examples.py
      - name: Agent tests
        working-directory: agents
        run: python -m pytest
      - run: python -m pytest eval/tests
      - name: Eval gate (offline)
        run: python eval/run.py --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-offline
          path: eval/out/report.json

  viewer:
    name: Viewer (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: viewer
        run: node --test tests/
