[project]
name = "smi-agents"
version = "0.1.0"
description = "Agent workflow and MCP server for the Synthetic Match Intelligence Engine"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core==1.20.0",
    "agent-framework-foundry==1.14.0",
    "azure-identity==1.26.0",
    "azure-cosmos==4.17.1",
    "azure-monitor-opentelemetry==1.8.11",
    "mcp==2.3.0",
    "httpx==0.28.1",
    "pydantic>=2.13,<3",
    "pyyaml>=6,<7",
    # Both come with the MCP SDK; listed because the agent service uses them directly.
    "starlette>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "datamodel-code-generator==0.83.0"]
# Foundry evaluators for the online eval gate (eval/run.py --online).
eval = ["azure-ai-evaluation==1.18.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smi_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["smi_agents", "conftest"]

[tool.ruff.lint.per-file-ignores]
"src/smi_agents/models/*.py" = ["E501"]  # generated
