# Template lines per reason code and language (D4 hot path, D7 fallback). Filled from the FactSheet
# only: {team} {opponent} {player} {minute} and fact names, with :int, :1, :2 (decimals) or :pct
# (share as a percentage). Every line must pass the Verifier for every insight that uses it
# (tests/test_templates.py). Names stay in Latin script in every language.

codes:
  # ---- goal ----
  counter_attack_goal:
    en:
      headline: "{player} finishes a counter for {team}"
      body: "{team} won the ball and scored {possession_duration_s:int} seconds later, after {possession_passes:int} passes. It is {team_goals:int}-{opponent_goals:int}."
    es:
      headline: "{player} culmina un contraataque de {team}"
      body: "{team} recuperó el balón y marcó {possession_duration_s:int} segundos después, tras {possession_passes:int} pases. Va {team_goals:int}-{opponent_goals:int}."
    hi:
      headline: "{player} ने {team} के काउंटर को गोल में बदला"
      body: "{team} ने गेंद जीती और {possession_passes:int} पास के बाद {possession_duration_s:int} सेकंड में गोल कर दिया। स्कोर {team_goals:int}-{opponent_goals:int}।"
  equaliser:
    en:
      headline: "{player} levels it for {team}"
      body: "{team} are back on terms at {team_goals:int}-{opponent_goals:int} in minute {minute}, from a chance worth {xg:2} xG."
    es:
      headline: "{player} empata para {team}"
      body: "{team} iguala {team_goals:int}-{opponent_goals:int} en el minuto {minute}, con una ocasión de {xg:2} xG."
    hi:
      headline: "{player} ने {team} को बराबरी दिलाई"
      body: "मिनट {minute} में {team} ने स्कोर {team_goals:int}-{opponent_goals:int} से बराबर किया। मौके की कीमत {xg:2} xG थी।"
  takes_lead:
    en:
      headline: "{player} puts {team} ahead"
      body: "{team} lead {team_goals:int}-{opponent_goals:int} after a finish in minute {minute} from a chance worth {xg:2} xG."
    es:
      headline: "{player} adelanta a {team}"
      body: "{team} gana {team_goals:int}-{opponent_goals:int} tras el gol del minuto {minute}, una ocasión de {xg:2} xG."
    hi:
      headline: "{player} के गोल से {team} को बढ़त"
      body: "मिनट {minute} के गोल के बाद {team} {team_goals:int}-{opponent_goals:int} से आगे है। मौके की कीमत {xg:2} xG थी।"
  extends_lead:
    en:
      headline: "{player} makes it {team_goals:int}-{opponent_goals:int} for {team}"
      body: "{team} extend the lead in minute {minute} with a chance worth {xg:2} xG."
    es:
      headline: "{player} pone el {team_goals:int}-{opponent_goals:int} para {team}"
      body: "{team} amplía su ventaja en el minuto {minute} con una ocasión de {xg:2} xG."
    hi:
      headline: "{player} ने {team} के लिए {team_goals:int}-{opponent_goals:int} किया"
      body: "मिनट {minute} में {team} ने अपनी बढ़त और बड़ी की। मौके की कीमत {xg:2} xG थी।"
  pulls_one_back:
    en:
      headline: "{player} pulls one back for {team}"
      body: "{team} trail {team_goals:int}-{opponent_goals:int} after a goal in minute {minute} from a chance worth {xg:2} xG."
    es:
      headline: "{player} recorta distancias para {team}"
      body: "{team} pierde {team_goals:int}-{opponent_goals:int} tras el gol del minuto {minute}, una ocasión de {xg:2} xG."
    hi:
      headline: "{player} ने {team} के लिए एक गोल वापस किया"
      body: "मिनट {minute} के गोल के बाद भी {team} {team_goals:int}-{opponent_goals:int} से पीछे है। मौके की कीमत {xg:2} xG थी।"
  # ---- red card ----
  down_to_ten:
    en:
      headline: "{team} down to {players_left:int} men"
      body: "{player} is sent off in minute {minute}. {team} play on with {players_left:int} at {team_goals:int}-{opponent_goals:int}."
    es:
      headline: "{team} se queda con {players_left:int}"
      body: "{player} es expulsado en el minuto {minute}. {team} sigue con {players_left:int} jugadores con el {team_goals:int}-{opponent_goals:int}."
    hi:
      headline: "{team} के अब {players_left:int} खिलाड़ी"
      body: "मिनट {minute} में {player} को लाल कार्ड मिला। स्कोर {team_goals:int}-{opponent_goals:int} है और {team} {players_left:int} खिलाड़ियों के साथ खेलेगी।"
  down_to_nine:
    en:
      headline: "{team} down to {players_left:int} men"
      body: "A second red card for {team}: {player} is sent off in minute {minute} at {team_goals:int}-{opponent_goals:int}."
    es:
      headline: "{team} se queda con {players_left:int}"
      body: "Otra tarjeta roja para {team}: {player} es expulsado en el minuto {minute} con el {team_goals:int}-{opponent_goals:int}."
    hi:
      headline: "{team} के अब {players_left:int} खिलाड़ी"
      body: "{team} को एक और लाल कार्ड: मिनट {minute} में {player} बाहर। स्कोर {team_goals:int}-{opponent_goals:int}।"
  # ---- key chance ----
  big_chance_missed:
    en:
      headline: "{player} misses a big chance"
      body: "A chance worth {xg:2} xG from {distance_m:int} metres goes begging for {team} in minute {minute}."
    es:
      headline: "{player} falla una ocasión clarísima"
      body: "{team} desperdicia en el minuto {minute} una ocasión de {xg:2} xG a {distance_m:int} metros."
    hi:
      headline: "{player} ने बड़ा मौका गंवाया"
      body: "मिनट {minute} में {team} ने {distance_m:int} मीटर से {xg:2} xG का मौका गंवा दिया।"
  big_chance_saved:
    en:
      headline: "Big save denies {player}"
      body: "The keeper keeps out a chance worth {xg:2} xG from {distance_m:int} metres in minute {minute}."
    es:
      headline: "Gran parada ante {player}"
      body: "El portero detiene en el minuto {minute} una ocasión de {xg:2} xG a {distance_m:int} metros."
    hi:
      headline: "शानदार बचाव, {player} का मौका नाकाम"
      body: "मिनट {minute} में गोलकीपर ने {distance_m:int} मीटर से आए {xg:2} xG के मौके को बचाया।"
  # ---- spells ----
  momentum_swings_to_team:
    en:
      headline: "Momentum swings to {team}"
      body: "{team} had {before_share:pct}% of the attacking actions from minute {before_from_minute:int} to {before_to_minute:int}, and {after_share:pct}% from then to minute {after_to_minute:int}."
    es:
      headline: "El impulso es ahora de {team}"
      body: "{team} tuvo el {before_share:pct}% de las acciones ofensivas del minuto {before_from_minute:int} al {before_to_minute:int}, y el {after_share:pct}% desde entonces hasta el {after_to_minute:int}."
    hi:
      headline: "खेल का रुख {team} की ओर"
      body: "मिनट {before_from_minute:int} से {before_to_minute:int} तक हमले की कार्रवाइयों में {team} का हिस्सा {before_share:pct}% था, और उसके बाद मिनट {after_to_minute:int} तक {after_share:pct}%।"
  high_press_spell:
    en:
      headline: "{team} turn up the press"
      body: "{team} pressed {after_pressures:int} times against {after_opponent_passes:int} {opponent} passes from minute {before_to_minute:int} to {after_to_minute:int}, a rate of {after_rate:2} per pass, up from {before_rate:2}."
    es:
      headline: "{team} sube la presión"
      body: "{team} presionó {after_pressures:int} veces ante {after_opponent_passes:int} pases de {opponent} del minuto {before_to_minute:int} al {after_to_minute:int}: {after_rate:2} por pase, antes {before_rate:2}."
    hi:
      headline: "{team} ने दबाव बढ़ाया"
      body: "मिनट {before_to_minute:int} से {after_to_minute:int} तक {team} ने {opponent} के {after_opponent_passes:int} पास पर {after_pressures:int} बार दबाव बनाया, यानी प्रति पास {after_rate:2}; पहले यह {before_rate:2} था।"
  pressing_raises_chance_quality:
    en:
      headline: "{team}'s press is paying off"
      body: "From minute {before_to_minute:int} to {after_to_minute:int}, {team} won the ball high {after_ball_wins_high:int} times and took {after_shots:int} shots."
    es:
      headline: "La presión de {team} da frutos"
      body: "Del minuto {before_to_minute:int} al {after_to_minute:int}, {team} recuperó arriba {after_ball_wins_high:int} veces y remató {after_shots:int} veces."
    hi:
      headline: "{team} के दबाव का फायदा मिल रहा है"
      body: "मिनट {before_to_minute:int} से {after_to_minute:int} तक {team} ने ऊपर {after_ball_wins_high:int} बार गेंद जीती और {after_shots:int} शॉट लगाए।"
  game_turns_chaotic:
    en:
      headline: "The game turns end to end"
      body: "Possession changed hands {after_possession_changes:int} times from minute {before_to_minute:int} to {after_to_minute:int}, up from {before_possession_changes:int}."
    es:
      headline: "El partido se vuelve de ida y vuelta"
      body: "La posesión cambió de manos {after_possession_changes:int} veces del minuto {before_to_minute:int} al {after_to_minute:int}, antes {before_possession_changes:int}."
    hi:
      headline: "मैच में तेज़ उतार-चढ़ाव"
      body: "मिनट {before_to_minute:int} से {after_to_minute:int} तक गेंद {after_possession_changes:int} बार एक टीम से दूसरी के पास गई; पहले यह {before_possession_changes:int} बार था।"
  team_takes_control:
    en:
      headline: "{team} take control"
      body: "{team} made {after_team_pass_share:pct}% of the passes from minute {before_to_minute:int} to {after_to_minute:int}, up from {before_team_pass_share:pct}%."
    es:
      headline: "{team} toma el control"
      body: "{team} dio el {after_team_pass_share:pct}% de los pases del minuto {before_to_minute:int} al {after_to_minute:int}, antes el {before_team_pass_share:pct}%."
    hi:
      headline: "{team} ने खेल पर पकड़ बनाई"
      body: "मिनट {before_to_minute:int} से {after_to_minute:int} तक {after_team_pass_share:pct}% पास {team} के थे; पहले यह {before_team_pass_share:pct}% था।"
  tempo_rises:
    en:
      headline: "The tempo picks up"
      body: "{after_per_minute:1} passes a minute from minute {before_to_minute:int} to {after_to_minute:int}, up from {before_per_minute:1}."
    es:
      headline: "Sube el ritmo"
      body: "{after_per_minute:1} pases por minuto del minuto {before_to_minute:int} al {after_to_minute:int}, antes {before_per_minute:1}."
    hi:
      headline: "खेल की रफ़्तार बढ़ी"
      body: "मिनट {before_to_minute:int} से {after_to_minute:int} तक हर मिनट {after_per_minute:1} पास; पहले {before_per_minute:1}।"
  tempo_drops:
    en:
      headline: "The tempo drops"
      body: "{after_per_minute:1} passes a minute from minute {before_to_minute:int} to {after_to_minute:int}, down from {before_per_minute:1}."
    es:
      headline: "Baja el ritmo"
      body: "{after_per_minute:1} pases por minuto del minuto {before_to_minute:int} al {after_to_minute:int}, antes {before_per_minute:1}."
    hi:
      headline: "खेल की रफ़्तार धीमी"
      body: "मिनट {before_to_minute:int} से {after_to_minute:int} तक हर मिनट {after_per_minute:1} पास; पहले {before_per_minute:1}।"
  # ---- milestones ----
  player_pass_milestone:
    en:
      headline: "{player} reaches {count:int} completed passes"
      body: "{player} has completed {count:int} passes for {team} by minute {minute}."
    es:
      headline: "{player} llega a {count:int} pases completados"
      body: "{player} suma {count:int} pases completados con {team} en el minuto {minute}."
    hi:
      headline: "{player} के {count:int} सफल पास पूरे"
      body: "मिनट {minute} तक {player} ने {team} के लिए {count:int} सफल पास दिए हैं।"
  brace:
    en:
      headline: "{player} scores again"
      body: "{player} now has {count:int} goals for {team}, the latest in minute {minute}."
    es:
      headline: "{player} marca otra vez"
      body: "{player} ya lleva {count:int} goles con {team}, el último en el minuto {minute}."
    hi:
      headline: "{player} का एक और गोल"
      body: "{player} के अब {team} के लिए {count:int} गोल हैं, ताज़ा गोल मिनट {minute} में।"
  hat_trick:
    en:
      headline: "Hat-trick for {player}"
      body: "{player} now has {count:int} goals for {team}, the latest in minute {minute}."
    es:
      headline: "Triplete de {player}"
      body: "{player} ya lleva {count:int} goles con {team}, el último en el minuto {minute}."
    hi:
      headline: "{player} की हैट्रिक"
      body: "{player} के अब {team} के लिए {count:int} गोल हैं, ताज़ा गोल मिनट {minute} में।"
  team_shot_milestone:
    en:
      headline: "{team} reach {count:int} shots"
      body: "{team} have taken {count:int} shots by minute {minute}."
    es:
      headline: "{team} llega a {count:int} remates"
      body: "{team} suma {count:int} remates en el minuto {minute}."
    hi:
      headline: "{team} के {count:int} शॉट"
      body: "मिनट {minute} तक {team} ने {count:int} शॉट लगाए हैं।"

  # ---- context: the score and the players on the pitch change what a moment means ----
  ten_men_equalise:
    en:
      headline: "{player} levels it for {team}, down to ten men"
      body: "With {ctx_players_for:int} players against {ctx_players_against:int}, {team} are level at {team_goals:int}-{opponent_goals:int} in minute {minute}. The extra man did not protect {opponent}."
    es:
      headline: "{player} empata para {team} con diez"
      body: "Con {ctx_players_for:int} jugadores contra {ctx_players_against:int}, {team} iguala {team_goals:int}-{opponent_goals:int} en el minuto {minute}. Tener uno más no salvó a {opponent}."
    hi:
      headline: "{player} ने {team} को बराबरी दिलाई, दस खिलाड़ियों के साथ"
      body: "{ctx_players_for:int} खिलाड़ियों के साथ, {ctx_players_against:int} के सामने, {team} ने मिनट {minute} में स्कोर {team_goals:int}-{opponent_goals:int} किया। {opponent} को एक खिलाड़ी ज़्यादा होने का फायदा नहीं मिला।"
  late_equaliser:
    en:
      headline: "{player} levels it late for {team}"
      body: "{team} are back on terms at {team_goals:int}-{opponent_goals:int} in minute {minute}, with little time left for {opponent} to answer."
    es:
      headline: "{player} empata al final para {team}"
      body: "{team} iguala {team_goals:int}-{opponent_goals:int} en el minuto {minute}, con poco tiempo para que {opponent} responda."
    hi:
      headline: "{player} ने देर से {team} को बराबरी दिलाई"
      body: "मिनट {minute} में {team} ने स्कोर {team_goals:int}-{opponent_goals:int} से बराबर किया, {opponent} के पास जवाब देने का कम समय है।"
  late_lead:
    en:
      headline: "{player} puts {team} ahead late on"
      body: "{team} lead {team_goals:int}-{opponent_goals:int} in minute {minute}. {opponent} now have very little time to come back."
    es:
      headline: "{player} adelanta a {team} al final"
      body: "{team} gana {team_goals:int}-{opponent_goals:int} en el minuto {minute}. A {opponent} le queda muy poco tiempo."
    hi:
      headline: "{player} ने देर से {team} को बढ़त दिलाई"
      body: "मिनट {minute} में {team} {team_goals:int}-{opponent_goals:int} से आगे है। {opponent} के पास वापसी का बहुत कम समय है।"
  ten_men_take_control:
    en:
      headline: "{team} take over with ten men"
      body: "With {ctx_players_for:int} against {ctx_players_against:int}, {team}'s share of attacking actions rose from {before_share:pct}% to {after_share:pct}%."
    es:
      headline: "{team} manda con diez"
      body: "Con {ctx_players_for:int} contra {ctx_players_against:int}, la cuota de acciones de ataque de {team} pasó del {before_share:pct}% al {after_share:pct}%."
    hi:
      headline: "दस खिलाड़ियों के साथ {team} का दबदबा"
      body: "{ctx_players_for:int} बनाम {ctx_players_against:int} खिलाड़ियों के साथ भी {team} के आक्रमण का हिस्सा {before_share:pct}% से बढ़कर {after_share:pct}% हो गया।"
  pressure_without_reward:
    en:
      headline: "{team} dominate but cannot find a shot"
      body: "{team}'s share of attacking actions rose from {before_share:pct}% to {after_share:pct}%, yet they took {after_shots:int} shots in the spell."
    es:
      headline: "{team} domina pero no remata"
      body: "La cuota de acciones de ataque de {team} pasó del {before_share:pct}% al {after_share:pct}%, pero remató {after_shots:int} veces en la fase."
    hi:
      headline: "{team} हावी है, पर शॉट नहीं"
      body: "{team} के आक्रमण का हिस्सा {before_share:pct}% से बढ़कर {after_share:pct}% हुआ, फिर भी इस दौर में {after_shots:int} शॉट लगे।"
  press_while_chasing:
    en:
      headline: "{team} press harder to get back into it"
      body: "At {ctx_score_for:int}-{ctx_score_against:int}, {team} pressed at {after_rate:2} per {opponent} pass from minute {before_to_minute:int} to {after_to_minute:int}, up from {before_rate:2}."
    es:
      headline: "{team} aprieta para volver al partido"
      body: "Con {ctx_score_for:int}-{ctx_score_against:int}, {team} presionó {after_rate:2} veces por pase de {opponent} del minuto {before_to_minute:int} al {after_to_minute:int}, antes {before_rate:2}."
    hi:
      headline: "वापसी के लिए {team} ने दबाव बढ़ाया"
      body: "स्कोर {ctx_score_for:int}-{ctx_score_against:int} पर, मिनट {before_to_minute:int} से {after_to_minute:int} तक {team} ने {opponent} के हर पास पर {after_rate:2} दबाव बनाया, पहले {before_rate:2}।"
  leaders_keep_the_ball:
    en:
      headline: "{team} keep the ball to protect their lead"
      body: "At {ctx_score_for:int}-{ctx_score_against:int}, {team}'s share of passes rose from {before_team_pass_share:pct}% to {after_team_pass_share:pct}%, so {opponent} see little of it."
    es:
      headline: "{team} guarda el balón para cuidar la ventaja"
      body: "Con {ctx_score_for:int}-{ctx_score_against:int}, la cuota de pases de {team} pasó del {before_team_pass_share:pct}% al {after_team_pass_share:pct}%, y {opponent} apenas lo toca."
    hi:
      headline: "बढ़त बचाने के लिए {team} ने गेंद अपने पास रखी"
      body: "स्कोर {ctx_score_for:int}-{ctx_score_against:int} पर {team} का पास हिस्सा {before_team_pass_share:pct}% से बढ़कर {after_team_pass_share:pct}% हुआ, {opponent} को गेंद कम मिल रही है।"

  # ---- player_spotlight: the pass that opened them up ----
  pass_creates_big_chance:
    en:
      headline: "{player}'s pass opens up {opponent}"
      body: "{player} moved the ball {metres_gained:int} m closer to goal and {player2} got a shot worth {shot_xg:2} xG."
    es:
      headline: "El pase de {player} abre a {opponent}"
      body: "{player} acercó el balón {metres_gained:int} m a la portería y {player2} remató con {shot_xg:2} xG."
    hi:
      headline: "{player} के पास ने {opponent} की रक्षा खोल दी"
      body: "{player} ने गेंद गोल की ओर {metres_gained:int} मीटर आगे बढ़ाई और {player2} को {shot_xg:2} xG का शॉट मिला।"
  creator_in_form:
    en:
      headline: "{player} keeps driving {team} forward"
      body: "{player} has now made {passer_progressive_passes:int} passes that move {team} upfield. This one gained {metres_gained:int} m and set up a shot for {player2}."
    es:
      headline: "{player} sigue empujando a {team}"
      body: "{player} ya suma {passer_progressive_passes:int} pases progresivos. Este ganó {metres_gained:int} m y dejó un remate a {player2}."
    hi:
      headline: "{player} लगातार {team} को आगे ले जा रहे हैं"
      body: "{player} अब तक {passer_progressive_passes:int} आगे बढ़ाने वाले पास दे चुके हैं। इस पास से {metres_gained:int} मीटर मिले और {player2} को शॉट मिला।"
  line_breaking_pass:
    en:
      headline: "{player} cuts through {opponent}"
      body: "{player}'s pass gained {metres_gained:int} m, a pass of {pass_difficulty:pct}% difficulty, and {player2} had a shot."
    es:
      headline: "{player} rompe líneas de {opponent}"
      body: "El pase de {player} ganó {metres_gained:int} m, con una dificultad del {pass_difficulty:pct}%, y {player2} pudo rematar."
    hi:
      headline: "{player} ने {opponent} की लाइन तोड़ी"
      body: "{player} के पास से {metres_gained:int} मीटर मिले, कठिनाई {pass_difficulty:pct}%, और {player2} ने शॉट लगाया।"

  # ---- tactical_shift: where a team defends (event-based estimate) ----
  sits_deep_to_protect_lead:
    en:
      headline: "{team} drop deeper to protect their lead"
      body: "At {ctx_score_for:int}-{ctx_score_against:int}, {team} now defend about {after_line_m:int} m up the pitch, down from {before_line_m:int} m."
    es:
      headline: "{team} se repliega para cuidar la ventaja"
      body: "Con {ctx_score_for:int}-{ctx_score_against:int}, {team} defiende ahora a unos {after_line_m:int} m de su portería, antes {before_line_m:int} m."
    hi:
      headline: "बढ़त बचाने के लिए {team} पीछे हटी"
      body: "स्कोर {ctx_score_for:int}-{ctx_score_against:int} पर {team} अब अपने छोर से लगभग {after_line_m:int} मीटर पर रक्षा कर रही है, पहले {before_line_m:int} मीटर।"
  team_sits_deeper:
    en:
      headline: "{team} drop deeper"
      body: "{team} now defend about {after_line_m:int} m up the pitch, down from {before_line_m:int} m, inviting {opponent} on."
    es:
      headline: "{team} se echa atrás"
      body: "{team} defiende ahora a unos {after_line_m:int} m de su portería, antes {before_line_m:int} m, y cede terreno a {opponent}."
    hi:
      headline: "{team} पीछे हटी"
      body: "{team} अब अपने छोर से लगभग {after_line_m:int} मीटर पर रक्षा कर रही है, पहले {before_line_m:int} मीटर, और {opponent} को आगे आने दे रही है।"
  pushes_up_to_chase:
    en:
      headline: "{team} push up to chase the game"
      body: "At {ctx_score_for:int}-{ctx_score_against:int}, {team} now defend about {after_line_m:int} m up the pitch, up from {before_line_m:int} m, risking space behind."
    es:
      headline: "{team} sube líneas para remontar"
      body: "Con {ctx_score_for:int}-{ctx_score_against:int}, {team} defiende ahora a unos {after_line_m:int} m de su portería, antes {before_line_m:int} m, y deja espacio a la espalda."
    hi:
      headline: "मैच में वापसी के लिए {team} आगे बढ़ी"
      body: "स्कोर {ctx_score_for:int}-{ctx_score_against:int} पर {team} अब अपने छोर से लगभग {after_line_m:int} मीटर पर रक्षा कर रही है, पहले {before_line_m:int} मीटर, लंबी गेंद के लिए जगह छोड़ते हुए।"
  team_pushes_higher:
    en:
      headline: "{team} push their line up"
      body: "{team} now defend about {after_line_m:int} m up the pitch, up from {before_line_m:int} m, squeezing {opponent} back."
    es:
      headline: "{team} sube su línea"
      body: "{team} defiende ahora a unos {after_line_m:int} m de su portería, antes {before_line_m:int} m, y encierra a {opponent}."
    hi:
      headline: "{team} ने अपनी लाइन आगे की"
      body: "{team} अब अपने छोर से लगभग {after_line_m:int} मीटर पर रक्षा कर रही है, पहले {before_line_m:int} मीटर, और {opponent} को उनके हाफ़ में दबा रही है।"

# Whether the moment is good or bad news for the insight's subject team (its first team), for the
# club fan's framing. Codes not listed are good news for the subject.
  # ---- full_time (ADR-023): the recap. `plain` is the body for plain personas. ----
  full_time_win:
    en:
      headline: "Full time: {team} beat {opponent} {team_goals:int}-{opponent_goals:int}"
      body: "{team} won with {team_shots:int} shots to {opponent_shots:int}, {team_shots_on_target:int} of them on target."
      plain: "{team} win {team_goals:int}-{opponent_goals:int} against {opponent}."
    es:
      headline: "Final: {team} gana {team_goals:int}-{opponent_goals:int} a {opponent}"
      body: "{team} ganó con {team_shots:int} tiros contra {opponent_shots:int}, {team_shots_on_target:int} de ellos a puerta."
      plain: "{team} gana {team_goals:int}-{opponent_goals:int} a {opponent}."
    hi:
      headline: "फुल टाइम: {team} ने {opponent} को {team_goals:int}-{opponent_goals:int} से हराया"
      body: "{team} ने {team_shots:int} शॉट लिए और {opponent} ने {opponent_shots:int}; {team} के {team_shots_on_target:int} शॉट निशाने पर थे।"
      plain: "{team} ने {opponent} को {team_goals:int}-{opponent_goals:int} से हराया।"
  win_against_the_run_of_play:
    en:
      headline: "Full time: {team} win {team_goals:int}-{opponent_goals:int} against the run of play"
      body: "{opponent} created more, {opponent_xg:2} xG to {team_xg:2}, but {team} took their chances."
      plain: "{opponent} had the better chances, but {team} took theirs and win {team_goals:int}-{opponent_goals:int}."
    es:
      headline: "Final: {team} gana {team_goals:int}-{opponent_goals:int} contra el guion del partido"
      body: "{opponent} generó más, {opponent_xg:2} xG contra {team_xg:2}, pero {team} aprovechó sus ocasiones."
      plain: "{opponent} tuvo mejores ocasiones, pero {team} aprovechó las suyas y gana {team_goals:int}-{opponent_goals:int}."
    hi:
      headline: "फुल टाइम: कम मौकों के बावजूद {team} ने {team_goals:int}-{opponent_goals:int} से मैच जीता"
      body: "{opponent} ने ज़्यादा मौके बनाए, {opponent_xg:2} xG बनाम {team_xg:2}, पर {team} ने अपने मौके भुनाए।"
      plain: "{opponent} के मौके बेहतर थे, पर {team} ने अपने मौके भुनाकर {team_goals:int}-{opponent_goals:int} से मैच जीता।"
  full_time_draw:
    en:
      headline: "Full time: {team} {team_goals:int}-{opponent_goals:int} {opponent}"
      body: "The points are shared after {team_shots:int} shots to {opponent_shots:int}."
      plain: "It finishes {team_goals:int}-{opponent_goals:int}, and the points are shared."
    es:
      headline: "Final: {team} {team_goals:int}-{opponent_goals:int} {opponent}"
      body: "Reparto de puntos tras {team_shots:int} tiros contra {opponent_shots:int}."
      plain: "Termina {team_goals:int}-{opponent_goals:int} y se reparten los puntos."
    hi:
      headline: "फुल टाइम: {team} {team_goals:int}-{opponent_goals:int} {opponent}"
      body: "{team_shots:int} शॉट बनाम {opponent_shots:int} के बाद अंक बंट गए।"
      plain: "मैच {team_goals:int}-{opponent_goals:int} पर खत्म हुआ और अंक बंट गए।"
  late_equaliser_draw:
    en:
      headline: "Full time: {team} snatch a {team_goals:int}-{opponent_goals:int} draw late on"
      body: "{team} levelled in minute {last_goal_minute:int} and held on for a point against {opponent}."
      plain: "{team} levelled in minute {last_goal_minute:int} and take a point from {opponent}."
    es:
      headline: "Final: {team} rescata un {team_goals:int}-{opponent_goals:int} al final"
      body: "{team} igualó en el minuto {last_goal_minute:int} y se llevó un punto ante {opponent}."
      plain: "{team} igualó en el minuto {last_goal_minute:int} y suma un punto ante {opponent}."
    hi:
      headline: "फुल टाइम: आखिरी पलों में {team} ने {team_goals:int}-{opponent_goals:int} से अंक लिया"
      body: "{team} ने {last_goal_minute:int}वें मिनट में बराबरी की और {opponent} से एक अंक हासिल किया।"
      plain: "{team} ने {last_goal_minute:int}वें मिनट में बराबरी की और {opponent} से एक अंक लिया।"
  ten_men_take_a_point:
    en:
      headline: "Full time: ten-man {team} take a point from {opponent}"
      body: "With {ctx_players_for:int} players against {ctx_players_against:int}, {team} still finished {team_goals:int}-{opponent_goals:int}."
      plain: "Down to ten men, {team} still finish {team_goals:int}-{opponent_goals:int} and take a point."
    es:
      headline: "Final: {team}, con diez, suma un punto ante {opponent}"
      body: "Con {ctx_players_for:int} jugadores contra {ctx_players_against:int}, {team} terminó {team_goals:int}-{opponent_goals:int}."
      plain: "Con diez jugadores, {team} termina {team_goals:int}-{opponent_goals:int} y suma un punto."
    hi:
      headline: "फुल टाइम: दस खिलाड़ियों वाली {team} ने {opponent} से अंक लिया"
      body: "{ctx_players_against:int} के खिलाफ {ctx_players_for:int} खिलाड़ियों के साथ भी {team} ने मैच {team_goals:int}-{opponent_goals:int} पर खत्म किया।"
      plain: "दस खिलाड़ियों के साथ भी {team} ने मैच {team_goals:int}-{opponent_goals:int} पर खत्म किया और एक अंक लिया।"

