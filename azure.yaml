# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Images build with Docker where azd runs: the GitHub Actions runner (.github/workflows/azure-dev.yml).
# Remote builds in Container Registry (ACR Tasks) are not available on this subscription.
name: smi
infra:
  provider: bicep
  path: infra
  module: main
services:
  core:
    project: ./core
    host: containerapp
    language: docker
    docker:
      path: Dockerfile
      remoteBuild: false
    hooks:
      prepackage:
        shell: sh
        run: sbt assembly
  agents:
    project: ./agents
    host: containerapp
    language: docker
    docker:
      path: Dockerfile
      remoteBuild: false
  viewer:
    project: ./viewer
    host: staticwebapp
    language: js
    dist: .
hooks:
  postprovision:
    shell: sh
    run: ./infra/hooks/postprovision.sh
