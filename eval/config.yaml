# Eval gate settings (eval/run.py). A run fails when a threshold is missed or a score regresses
# against eval/baseline.json by more than the tolerance.

match:
  seed: 154            # the demo match (synthetic, deterministic)
  min_importance: 0.6  # moment-path insights (D4)
  # Plus the top insight of each interpretive kind below the cut (ADR-017), so every kind the viewer
  # narrates with the model is judged.
  also_kinds: [pressure_shift, tactical_shift, player_spotlight]

thresholds:
  number_match_rate: {min: 1.0}    # every number in every line is a tool answer (rule 3)
  verified_rate: {min: 1.0}        # every published line passed the Verifier
  fallback_rate: {max: 0.25}       # template lines after three rejections
  first_attempt_rate: {min: 0.6}
  latency_p95_ms: {max: 4000}      # moment path budget, about 2-4 s (D4)
  # AI-judged scores (online only, 1-5): a floor, plus the baseline check below.
  foundry_groundedness: {min: 3.0}
  foundry_relevance: {min: 3.0}
  foundry_fluency: {min: 3.0}
  foundry_coherence: {min: 3.0}

# Per-mode overrides. Online narration makes 2-3 real model calls per line (explain, narrate,
# localize); the limit is set from the first measured run.
online_thresholds:
  latency_p95_ms: {max: 15000}

# Regression check against eval/baseline.json: the relative drop allowed per metric. The facts
# (number match, verified) allow none. The AI-judged scores move by about 0.5 between identical
# runs on 16 lines, so they get 15%. Fallback and first-attempt rates vary with the model's
# sampling and are bounded only by their thresholds above.
regression:
  number_match_rate: {higher_is_better: true, tolerance: 0.0}
  verified_rate: {higher_is_better: true, tolerance: 0.0}
  foundry_groundedness: {higher_is_better: true, tolerance: 0.15}
  foundry_relevance: {higher_is_better: true, tolerance: 0.15}
  foundry_fluency: {higher_is_better: true, tolerance: 0.15}
  foundry_coherence: {higher_is_better: true, tolerance: 0.15}

foundry:
  sample: 16  # English lines scored by the Foundry evaluators (each costs model calls)
